<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>responsividade</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: #dfd8d8;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;

        }
        nav{
            display: flex;
            width: 100%;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0.5rem;
            background-color: white;
        }
        .links{
            display: flex;
            gap: 10px;
        }
        a{
            text-decoration: none;
            color: #2c2c2c;
        }
        .content{
            width: 100%;
            display: flex;
            justify-content:space-between;
            padding: 1.25rem;
            gap: 20px;
        }
        .content-flex{
            height: 250px;
            width: 300px;
            background-color: bisque;
            border-radius: 8px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @media screen and (max-width: 700px) {
            nav{
                flex-direction: column;
                gap: 20px;
            }
            .content{
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 20px;
            }

        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">
            <h1>C-Space Academy</h1>
        </div>
        <div class="links">
            <a href="#"><span>Home</span></a>
            <a href="#"><span>Sobre</span></a>
            <a href="#"><span>Contacto</span></a>
        </div>
    </nav>
    <div class="content">
        <div class="content-flex">
            <h2>Contéudo teste</h2>
        </div>
        <div class="content-flex">
            <h2>Contéudo teste2</h2>
        </div>
        
    </div>
</body>
</html>
